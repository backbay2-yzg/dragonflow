name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create Release PR / GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      upload_url: ${{ steps.release.outputs.upload_url }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # 说明：默认使用 GITHUB_TOKEN 即可创建 Release PR 与 Tag/Release。
          # 注意：由 GITHUB_TOKEN 创建的 Release PR 默认不会自动触发 pull_request CI；
          # 如需 Release PR 自动触发 ci.yml，请配置 PAT 或 GitHub App Token：${{ secrets.RELEASE_PLEASE_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ---------------------------------------------------------------------------
  # 可选扩展 Hook：仅当本次合并 Release PR 实际生成了新 Release 时触发以下发布任务
